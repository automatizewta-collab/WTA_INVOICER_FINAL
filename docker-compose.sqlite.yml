# =============================================
# INVOICER - SQLite (default, no external DB)
# Simple single-container setup
# =============================================

services:
  invoicer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoicer-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=file:/app/data/invoicer.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-to-a-random-32-char-string}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - invoicer-data:/app/data
    restart: unless-stopped

volumes:
  invoicer-data:
    driver: local