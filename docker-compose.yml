# =============================================
# INVOICER - Default docker-compose (SQLite)
# Run: docker compose up -d
# =============================================

services:
  invoicer:
    build:
      context: .
    container_name: invoicer-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/invoicer.db
      - NEXTAUTH_SECRET=dev-secret-min-32-chars-long-change-me-ok
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - invoicer-data:/app/data
    restart: unless-stopped

volumes:
  invoicer-data:
    driver: local